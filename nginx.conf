# Redirecciona todo HTTP para HTTPS
server {
    listen 80;
    server_name siglab.app.co.mz;
    return 301 https://$host$request_uri;
}

# Bloco principal HTTPS com proxy e headers correctos
server {
    listen 443 ssl http2;
    server_name siglab.app.co.mz;

    # Certificados SSL Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/siglab.app.co.mz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siglab.app.co.mz/privkey.pem;

    # Segurança extra
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Protocolos e cifragem recomendada
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy para a tua aplicação backend
    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Headers importantes para backend saber o contexto real do cliente
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSockets e upgrades de protocolo
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts e buffers (ajusta se necessário)
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
        proxy_buffering        off;
    }
}
